framework:
    html_sanitizer:
        sanitizers:
            app.content_sanitizer:
                allow_safe_elements: true
                allow_relative_links: true
                allow_relative_medias: true
                allow_elements:
                    div: ['class', 'data-callout', 'data-columns', 'data-column']
                    mark: ['class']
                    span: ['class']
                    a: ['class', 'href', 'target', 'rel', 'download', 'data-document-id', 'data-extension']
                    i: ['class']
                    # SVG inline (Bootstrap Icons via IconExtension::icon) — utilises
                    # par le rendu front du module Documents.
                    svg: ['class', 'width', 'height', 'fill', 'viewBox', 'xmlns']
                    path: ['d', 'fill', 'fill-rule', 'clip-rule']
                    table: ['class']
                    thead: []
                    tbody: []
                    tr: []
                    th: ['colspan', 'rowspan']
                    td: ['colspan', 'rowspan']
                allow_attributes:
                    style: ['p', 'h2', 'h3', 'h4', 'h5', 'h6']
