; Plafonds de telechargement, lus par PHP en CGI/FastCGI -- c'est le cas de
; l'hebergement mutualise OVH, ou docker/php/php.ini ne s'applique pas.
;
; Deux besoins a couvrir :
;   - l'administration accepte un document de 25 Mo (DocumentService) ;
;   - l'espace client accepte 8 Mo par piece et 20 Mo par depot.
; post_max_size doit rester superieur a upload_max_filesize, l'enveloppe
; multipart pesant un peu plus que les fichiers eux-memes.
;
; max_file_uploads ne figure pas ici : c'est une directive systeme, qu'un
; .user.ini ne peut pas changer. Sa valeur par defaut (20) couvre les 12
; pieces d'un depot.
upload_max_filesize = 32M
post_max_size = 64M
